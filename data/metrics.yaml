    tooltip: "Сколько ты пробегаешь за один раунд."
    scope: "Сумма перемещений между сэмплами позиции (1 раз в секунду) делится на число раундов. Юнит ≈ 1.9 см, вся карта ≈ 4 000–5 000 юнитов."
