    direction: "neutral"
    minSample: 20
    formula: "`z(поздний контакт) + z(низкий урон в опенинге) − z(поддержка)`"
    tooltip: "Склонность ждать, пока союзник примет бой. Не всегда плохо."
    sources: ["Leetify", "Scope", "CSStats"]
    version: 1
  - id: "TEA-011"
    name: "Вклад в удержание точки"
    domain: "Командная игра"
    unit: "% раундов"
    direction: "up"
    minSample: 10
    formula: "`N(hold_wins с вашим участием) / holds × 100`"
    tooltip: "Как часто ваше участие совпадает с успешным удержанием."
    sources: ["Leetify", "Scope", "CSStats"]
    version: 1
  - id: "TEA-012"
    name: "Совместные фраги"
    domain: "Командная игра"
    unit: "шт."
    direction: "up"
    minSample: 20
    formula: "`N(kills, где союзник нанёс урон цели до вас)`"
    tooltip: "Убийства после урона союзника. Показывает командную работу."
    sources: ["Leetify", "Scope", "CSStats"]
    version: 1
  - id: "TEA-013"
    name: "Доля поддержки от команды"
    domain: "Командная игра"
    unit: "%"
    direction: "up"
    minSample: 50
    formula: "`N(kills с assist) / kills × 100`"
    tooltip: "Какая часть ваших убийств была с ассистом."
    sources: ["Leetify", "Scope", "CSStats"]
    version: 1
  - id: "TEA-014"
    name: "Синергия с тиммейтом"
    domain: "Командная игра"
    unit: "винрейт с игроком"
    direction: "up"
    minSample: 10
    formula: "`wins_together / matches_together × 100`"
    tooltip: "Винрейт в матчах с конкретным союзником. Показывает совместимость, но зависит от уровня."
    sources: ["Leetify", "Scope", "CSStats"]
    version: 1
  - id: "TEA-015"
    name: "Совместное присутствие"
    domain: "Командная игра"
    unit: "% тиков"
    direction: "neutral"
    minSample: 200
    formula: "`N(ticks в 400 юнитах от игрока) / ticks × 100`"
    tooltip: "Сколько времени вы проводите с конкретным союзником."
    sources: ["Leetify", "Scope", "CSStats"]
    version: 1
  - id: "TEA-016"
    name: "Потери в паре"
    domain: "Командная игра"
    unit: "%"
    direction: "down"
    minSample: 20
    formula: "`N(обе смерти в 3 с) / pair_deaths × 100`"
    tooltip: "Как часто в парной игре погибают оба. Показывает синхронность и риск."
    sources: ["Leetify", "Scope", "CSStats"]
    version: 1
  - id: "TEA-017"
    name: "Размен в паре"
    domain: "Командная игра"
    unit: "%"
    direction: "up"
    minSample: 20
    formula: "`N(pair_contact, где второй убил) / pair_contacts × 100`"
    tooltip: "Как часто второй игрок пары мстит за первого."
    sources: ["Leetify", "Scope", "CSStats"]
    version: 1
  - id: "IMP-001"
    name: "HLTV Rating 1.0 (reference)"
    domain: "Рейтинги"
    unit: "рейтинг"
    direction: "up"
    minSample: 100
    formula: "`KillRating = KPR / 0.679`\r\n  `SurvivalRating = (выжил_раундов / R) / 0.317`\r\n  `RWMK = (1K + 4·2K + 9·3K + 16·4K + 25·5K) / R / 1.277`\r\n  `Rating = (KillRating + 0.7·SurvivalRating + RWMK) / 2.7`"
    tooltip: "Старый рейтинг HLTV 1.0. Формула собрана реверс-инжинирингом и может отличаться от оригинала на сотые. Нормирован так, что 1.00 — средний уровень."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-002"
    name: "HLTV-подобный рейтинг за матч (2.0)"
    domain: "Рейтинги"
    unit: "рейтинг"
    direction: "up"
    minSample: 100
    formula: "`Rating2 = 0.0073·KAST + 0.3591·KPR − 0.5329·DPR + 0.2372·Impact + 0.0032·ADR + 0.1587`\r\n  где `Impact = 2.13·KPR + 0.42·APR − 0.41`;\r\n  KAST — в процентах (0–100), ADR — в HP, KPR/DPR/APR — в долях."
    tooltip: "Классический рейтинг 2.0, пересчитанный из демок."
    scope: "Считается по формуле HLTV 2.0 из KAST, убийств, смертей и ADR за каждый матч, затем взвешивается по раундам."
    example: "KAST 77%, 0.95 K/D, ADR 80 → около 1.05."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-003"
    name: "HLTV Rating 2.1 (reference)"
    domain: "Рейтинги"
    unit: "рейтинг"
    direction: "up"
    minSample: 100
    formula: "та же структура, что 2.0, но с пересчитанными весами под CS2 и сниженной наградой за сейвы; коэффициенты не публичны, используем калибровку 2.0 с поправкой на сейв (сейв-рейт входит с весом −0.05)"
    tooltip: "Версия 2.1, введённая под CS2. Точные веса закрыты; отображается как reference с пометкой «аппроксимация"
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-004"
    name: "HLTV Rating 3.0 (reference)"
    domain: "Рейтинги"
    unit: "рейтинг"
    direction: "up"
    minSample: 200
    formula: "шесть саб-рейтингов: Kills, Damage, Survival, KAST, Multi-Kills, Round Swing; 2.1-часть корректируется на экономику, затем суммируется с Round Swing и нормируется к среднему 1.00"
    tooltip: "Rating 3.0 с экономической поправкой и Round Swing. Формула закрыта; реализуем собственную аппроксимацию Round Swing через изменение вероятности победы в раунде."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-005"
    name: "Impact Rating (reference)"
    domain: "Рейтинги"
    unit: "рейтинг"
    direction: "up"
    minSample: 100
    formula: "`2.13·KPR + 0.42·APR − 0.41`"
    tooltip: "Оценка взрывного импакта: мультикиллы, опенинги, клатчи, ассисты. Входит в Rating 2.0. Высокий Impact при низком KAST — нестабильность."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-006"
    name: "Leetify Rating (reference)"
    domain: "Рейтинги"
    unit: "± очки"
    direction: "up"
    minSample: 50
    formula: "1. До раунда: `WP0 = f(eco_band_CT, eco_band_T)` из исторической таблицы HLTV.\r\n  2. Каждый килл: `ΔWP = WP_after − WP_before`; киллы в пределах 4 с объединяются в цепочку с линейным весом `w = 1 − Δt/4`.\r\n  3. Награда `R = ΔWP · w` делится: убийца 35%, дамагеры 30%, флеш-ассист 15%, обменянный 20%; отсутствующие доли масштабируются до 100%.\r\n  4. Смерть списывает `−ΔWP` только умершему.\r\n  5. Сейв: награда пропорциональна стоимости сохранённого и приросту WP следующего раунда, кап — награда победителей за предыдущий раунд.\r\n  6. Рейтинг = среднее по раундам; сумма по игрокам = 0."
    tooltip: "Zero-sum рейтинг влияния на вероятность победы. Учитывает экономику, число живых, цепочки киллов, сейвы. Награда за килл делится между участниками. Среднее по раундам."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-007"
    name: "CSDB Rating (reference)"
    domain: "Рейтинги"
    unit: "0–10"
    direction: "up"
    minSample: 100
    formula: "`0.30·Aim + 0.20·Positioning + 0.15·Utility + 0.20·Mechanics + 0.10·Opening + 0.05·WinImpact`, затем `× rank_multiplier` (1.05 для высоких банд)"
    tooltip: "Композит 0–10 с ранговой поправкой. Веса фиксированы; версия формулы хранится вместе со значением."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-008"
    name: "Refrag-style normalized rating"
    domain: "Рейтинги"
    unit: "0–1"
    direction: "up"
    minSample: 100
    formula: "`Σ w_i · minmax(z_i)` по 30 метрикам; `w_i` = корреляция метрики с рангом внутри бэнда, нормированная к 1"
    tooltip: "Рейтинг по методологии Refrag: метрики нормируются min-max, веса зависят от рангового бэнда. Показывает, насколько вы похожи на сильного игрока своего ранга."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-009"
    name: "CSRep Trust Score (reference)"
    domain: "Рейтинги"
    unit: "0–100"
    direction: "up"
    minSample: 90
    formula: "`0.5·StatisticalTrust + 0.3·AccountFlags + 0.2·Anomalies + bonus`, каждый компонент 0–100"
    tooltip: "Оценка доверия к аккаунту. Не вероятность легитимности, а агрегат статистических и аккаунтных сигналов."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-010"
    name: "Giga Score"
    domain: "Рейтинги"
    unit: "0–100"
    direction: "up"
    minSample: 200
    formula: "`z_p = (x_p − μ_p(rank, map, season)) / σ_p`\r\n  `z'_p = z_p · n_p / (n_p + 50)`\r\n  `G = 50 + 10 · Σ(w_p · z'_p) / Σw_p`\r\n  Веса: Aim 0,30; Utility 0,15; Positioning 0,20; Opening 0,15; Clutch 0,10; Survival 0,10."
    tooltip: "Собственный композит. Каждая метрика переводится в z-оценку относительно вашего ранга, карты и сезона, сжимается по выборке и взвешивается. 50 — средний уровень, 100 — топ. Формула полностью открыта."
    scope: "шесть компонентов с фиксированными весами: Aim 0.30, Utility 0.15, Positioning 0.20, Opening 0.15, Clutch 0.10, Survival 0.10. Каждый компонент — z-оценка относительно твоего ранга, карты и сезона, сжатая по размеру выборки n/(n+50). Пока не все шесть компонентов посчитаны, итог отдаётся как N/A."
    example: "Aim 60 (z=+1), остальные пять на среднем (z=0) → G = 50 + 10 × (0.30 × 1) = 53."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-011"
    name: "Aim Rating — сводная оценка прицеливания (0–100)"
    domain: "Рейтинги"
    unit: "0–100"
    direction: "up"
    minSample: 150
    formula: "`50 + 10 · mean(z(ACC-003, ACC-011, AIM-012, AIM-028))`"
    tooltip: "Сводная оценка прицеливания по четырём измеримым компонентам, нормированная на игроков из твоих демок."
    scope: "Четыре компонента: точность (ACC-003), попадания в голову (ACC-011), доля выстрелов на остановке (AIM-012) и точность в зажиме (AIM-028). Каждый переводится в z-оценку относительно всех игроков из разобранных демок; итог = 50 + 10 × среднее z. 50 — средний игрок выборки, 60 — на одно стандартное отклонение лучше."
    example: "Точность 20.0%, хедшоты 13.1%, стоп 94.1%, зажим 15.2% → z ≈ [−0.3, −0.6, +0.9, −0.2], среднее −0.05 → 49.5."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-012"
    name: "Utility Rating — сводная оценка ютилити (0–100)"
    domain: "Рейтинги"
    unit: "0–100"
    direction: "up"
    minSample: 100
    formula: "`50 + 10 · mean(z(флешек на раунд, смоков на раунд, урон HE на раунд, урон огнём на раунд))`"
    tooltip: "Сводная оценка ютилити: сколько гранат ты используешь и сколько ими наносишь."
    scope: "Четыре компонента на раунд: брошено флешек, брошено смоков, урон HE, урон огнём. Каждый — z-оценка среди игроков из демок; итог = 50 + 10 × среднее z. Это две оси сразу: сколько гранат и сколько ими нанесено."
    example: "0.9 флешки, 1.1 смока, 6 урона HE, 4 урона огнём → z ≈ [0.2, 0.4, −0.1, 0.1] → 51.5."
    alias: "UTL-038 (одна метрика, отображается и в блоке рейтингов)"
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-013"
    name: "Positioning Rating — сводная оценка позиционирования (0–100)"
    domain: "Рейтинги"
    unit: "0–100"
    direction: "up"
    minSample: 100
    formula: "`50 + 10 · mean(z(доля выживших раундов, трейд-киллы на раунд, −изоляция))`"
    tooltip: "Сводная оценка позиционирования: выживание, поддержка трейдом и игра вместе с командой."
    scope: "Три компонента: доля выживших раундов, трейд-киллы на раунд и изоляция (доля времени дальше 1200 юнитов от ближайшего союзника; меньше — лучше). z-оценки среди игроков из демок, итог = 50 + 10 × среднее z."
    example: "Выжил 40%, 0.10 трейда на раунд, изоляция 8.6% → z ≈ [0.0, −0.2, +0.3] → 50.3."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-014"
    name: "Opening Rating"
    domain: "Рейтинги"
    unit: "±"
    direction: "up"
    minSample: 40
    formula: "`ENT-005`, нормированный на 100 раундов"
    tooltip: "Суммарный вклад первых дуэлей в вероятность победы, нормированный на длину выборки."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-015"
    name: "Clutch Rating"
    domain: "Рейтинги"
    unit: "±"
    direction: "up"
    minSample: 15
    formula: "`CLT-010`"
    tooltip: "Вклад клатчей в вероятность победы с учётом сложности ситуации."
    alias: "CLT-010"
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-016"
    name: "Survival Rating"
    domain: "Рейтинги"
    unit: "%"
    direction: "up"
    minSample: 50
    formula: "`survived_rounds / rounds × 100`"
    tooltip: "Доля раундов, в которых вы выжили. Высокая — аккуратность, но может быть сейв вместо игры."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-017"
    name: "Personal Performance"
    domain: "Рейтинги"
    unit: "z"
    direction: "up"
    minSample: 30
    formula: "`z(LR_match | LR_history)` — отклонение рейтинга матча от вашего среднего"
    tooltip: "Насколько матч был лучше или хуже вашей личной нормы. Не сравнивает с другими игроками."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-018"
    name: "Consistency"
    domain: "Рейтинги"
    unit: "0–100"
    direction: "up"
    minSample: 20
    formula: "`100 · (1 − σ(LR_match) / (|mean(LR_match)| + 1))`, clamp 0–100"
    tooltip: "Стабильность рейтинга от матча к матчу. Низкая — качели, высокая — предсказуемость."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-019"
    name: "Kill Impact Share"
    domain: "Рейтинги"
    unit: "%"
    direction: "up"
    minSample: 50
    formula: "`Σ(impact_weight_kill) / Σ(impact_weight_all_events) × 100`"
    tooltip: "Какая часть вашего импакта приходится на убийства, а не на урон, флешки и сейвы."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-020"
    name: "Win Probability Added (WPA)"
    domain: "Рейтинги"
    unit: "± pp"
    direction: "up"
    minSample: 50
    formula: "`Σ(WP_after − WP_before)` по всем вашим действиям"
    tooltip: "Суммарное изменение вероятности победы от ваших действий. Основа Giga Score и LR, но без деления наград."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-021"
    name: "Expected WPA"
    domain: "Рейтинги"
    unit: "± pp"
    direction: "neutral"
    minSample: 50
    formula: "`Σ(WP_after_expected − WP_before)` по средним действиям игрока вашего ранга"
    tooltip: "Сколько WPA «должен"
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-022"
    name: "WPA over expectation"
    domain: "Рейтинги"
    unit: "± pp"
    direction: "up"
    minSample: 50
    formula: "`WPA − ExpectedWPA`"
    tooltip: "Превышение ожидаемого влияния. Убирает эффект лёгких/сложных ситуаций."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-023"
    name: "Round Swing"
    domain: "Рейтинги"
    unit: "± pp"
    direction: "up"
    minSample: 100
    formula: "`Σ |ΔWP|` по киллам, где действие изменило исход раунда, с экономической поправкой"
    tooltip: "Собственная реализация Round Swing HLTV: прямое изменение шансов раунда. Не путать с WPA: учитывается только свинг, не направление."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-024"
    name: "Economy-adjusted rating"
    domain: "Рейтинги"
    unit: "рейтинг"
    direction: "up"
    minSample: 100
    formula: "`HLTV2 + β·(eco_advantage_z)`, β калибруется по сезону"
    tooltip: "Рейтинг с поправкой на экономику: киллы на эко стоят дешевле, на форсе — дороже."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "IMP-025"
    name: "Highlight rate"
    domain: "Рейтинги"
    unit: "шт./матч"
    direction: "up"
    minSample: 10
    formula: "`Σ highlights / N(matches)`"
    tooltip: "Сколько ярких событий (3K+, эйс, клатч, валлбенг) в среднем за матч. Медийная, не соревновательная метрика."
    sources: ["Leetify", "HLTV", "CSDB", "Refrag", "CSRep", "Tracker"]
    version: 1
  - id: "FRM-001"
    name: "Форма за 5 матчей"
    domain: "Форма"
    unit: "Giga Score"
    direction: "up"
    minSample: 5
    formula: "`G` по последним 5 матчам"
    tooltip: "Сжатое окно формы. Очень шумное, но быстро реагирует на спад/подъём."
    sources: ["Leetify", "CSDB", "Scope"]
    version: 1
  - id: "FRM-002"
    name: "Форма за 10 матчей"
    domain: "Форма"
    unit: "Giga Score"
    direction: "up"
    minSample: 10
    formula: "`G` по последним 10"
    tooltip: "Компромисс между чувствительностью и шумом."
    sources: ["Leetify", "CSDB", "Scope"]
    version: 1
  - id: "FRM-003"
    name: "Форма за 20 матчей (эталон)"
    domain: "Форма"
    unit: "Giga Score"
    direction: "up"
    minSample: 20
    formula: "`G` по последним 20"
    tooltip: "Основное окно формы. Используется в сравнениях и трендах."
    sources: ["Leetify", "CSDB", "Scope"]
    version: 1
  - id: "FRM-004"
    name: "Форма за 50 матчей"
    domain: "Форма"
    unit: "Giga Score"
