    formula: "`N(kills, где killer.flash_duration > 0)`, делить на `N(matches)`"
    tooltip: "Убийства, совершённые, пока вы были ослеплены. Показатель памяти карты и слуха."
    sources: ["Leetify", "Scope", "CSStats", "Tracker", "SteamAnalyst"]
    version: 1
  - id: "KIL-023"
    name: "Убийства в воздухе"
    domain: "Объём боя"
    unit: "шт. и на матч"
    direction: "up"
    minSample: 10
    formula: "`N(kills, где `is_airborne` у убийцы)`, делить на `N(matches)`"
    tooltip: "Убийства в прыжке/падении. Часто AWP-трюки и вышки."
    sources: ["Leetify", "Scope", "CSStats", "Tracker", "SteamAnalyst"]
    version: 1
  - id: "KIL-024"
    name: "Убийства без прицеливания (noscope)"
    domain: "Объём боя"
    unit: "шт."
    direction: "up"
    minSample: 20
    formula: "`N(kills из AWP/SSG без `is_scoped` в момент выстрела)`"
    tooltip: "Убийства из снайперки без зума. Считаются только для снайперского оружия."
    sources: ["Leetify", "Scope", "CSStats", "Tracker", "SteamAnalyst"]
    version: 1
  - id: "KIL-025"
    name: "Доля убийств в голову по оружию"
    domain: "Объём боя"
    unit: "%"
    direction: "up"
    minSample: 20
    formula: "`headshot_kills_w / kills_w × 100`, для каждого `w`"
    tooltip: "HS% конкретного оружия. Позволяет увидеть, что AK вы используете в голову, а M4 — в корпус."
    sources: ["Leetify", "Scope", "CSStats", "Tracker", "SteamAnalyst"]
    version: 1
  - id: "KIL-026"
    name: "Убийства на оружие"
    domain: "Объём боя"
    unit: "шт."
    direction: "up"
    minSample: 1
    formula: "`Σ kills_w`"
    tooltip: "Сколько убийств сделано каждым оружием. Основа для карточки «лучшее оружие"
    sources: ["Leetify", "Scope", "CSStats", "Tracker", "SteamAnalyst"]
    version: 1
  - id: "ACC-001"
    name: "Выстрелы"
    domain: "Точность"
    unit: "шт."
    direction: "neutral"
    minSample: 1
    formula: "`Σ shots`"
    tooltip: "Все выстрелы из огнестрела. Нужны как знаменатель точности и как мера объёма стрельбы."
    exclude: "нож, зевс, гранаты, выстрелы в warmup."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-002"
    name: "Попадания"
    domain: "Точность"
    unit: "шт."
    direction: "up"
    minSample: 1
    formula: "`Σ hits`"
    tooltip: "Выстрелы, попавшие в игрока или его щит. Используются только как числитель точности."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-003"
    name: "Точность стрельбы: доля выстрелов, попавших в игрока"
    domain: "Точность"
    unit: "%"
    direction: "up"
    minSample: 100
    formula: "`ACC = hits / shots × 100`"
    tooltip: "Какая часть твоих выстрелов задела противника. Все выстрелы периода, включая промахи и стрельбу в воздух."
    exclude: "выстрелы в дым/стену без видимости цели."
    scope: "Считаются все выстрелы за период: в стены, в дым, в воздух и по союзникам тоже. Знаменатель — каждый выстрел, а не каждая перестрелка."
    example: "21 234 выстрела, 4 247 попали → 20.0%. Если стрелять в воздух, знаменатель растёт и процент падает."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-004"
    name: "Точность по замеченному противнику (spotted accuracy)"
    domain: "Точность"
    unit: "%"
    direction: "up"
    minSample: 50
    formula: "`ACC_SPT = hits_spotted / shots_spotted × 100`"
    tooltip: "Точность только по выстрелам, когда враг был в поле зрения."
    include: "выстрелы, когда цель была видима по §4.2."
    exclude: "стрельба по памяти, в дым, префайр без видимости."
    scope: "Знаменатель — только выстрелы, сделанные в момент, когда противник был виден (spotted). Выстрелы «наугад» и в дым не входят."
    example: "1 800 выстрелов по видимому врагу, 900 попали → 50.0%."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-005"
    name: "Точность первого выстрела серии (first bullet)"
    domain: "Точность"
    unit: "%"
    direction: "up"
    minSample: 40
    formula: "`ACC_FB = hits_first / shots_first × 100`"
    tooltip: "Как часто первый выстрел серии попадает в цель."
    include: "только первый выстрел каждого энгейджмента."
    scope: "Знаменатель — первый выстрел каждой серии (после паузы больше 8 тиков). Последующие выстрелы отдачи не входят."
    example: "1 000 серий, 320 первых выстрелов попали → 32.0%."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-006"
    name: "Точность в зажиме: попадания с 3-го выстрела серии"
    domain: "Точность"
    unit: "%"
    direction: "up"
    minSample: 60
    formula: "`ACC_SPR = hits_spray / shots_spray × 100`, спрей = ≥ 3 выстрелов подряд"
    tooltip: "Насколько хорошо ты контролируешь отдачу на длинных сериях."
    include: "винтовки, только по увиденному врагу."
    scope: "Знаменатель — выстрелы серии начиная с третьего. Первый и второй не входят."
    example: "2 000 выстрелов в зажиме, 500 попали → 25.0%."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-007"
    name: "Точность на длинной серии (с 4-го выстрела)"
    domain: "Точность"
    unit: "%"
    direction: "up"
    minSample: 60
    formula: "`ACC_RCL = hits_after4 / shots_after4 × 100`"
    tooltip: "Точность на самой длинной части зажима."
    include: "4-й и последующие выстрелы спрея, винтовки."
    scope: "Знаменатель — выстрелы серии с четвёртого и дальше. Показывает контроль на пике отдачи."
    example: "900 выстрелов, 180 попали → 20.0%."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-008"
    name: "Точность по классу оружия"
    domain: "Точность"
    unit: "%"
    direction: "up"
    minSample: 50
    formula: "`ACC_w = hits_w / shots_w × 100`, для класса `w`"
    tooltip: "Точность по группе оружия. Нужна, чтобы сравнить, например, AK и M4 без смешивания с пистолетами."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-009"
    name: "Точность по конкретному оружию"
    domain: "Точность"
    unit: "%"
    direction: "up"
    minSample: 30
    formula: "`ACC_weapon`"
    tooltip: "Точность конкретной пушки. Малые выборки помечаются; оружие с < 30 выстрелами скрывается в компактном режиме."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-010"
    name: "Попадания в голову"
    domain: "Точность"
    unit: "шт."
    direction: "up"
    minSample: 20
    formula: "`Σ hits с hitgroup=head`"
    tooltip: "Попадания в модель головы. Не путать с убийствами в голову."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-011"
    name: "Доля попаданий в голову среди всех попаданий"
    domain: "Точность"
    unit: "%"
    direction: "up"
    minSample: 30
    formula: "`HSA = head_hits / hits × 100`"
    tooltip: "Какая часть твоих попаданий пришлась в голову."
    exclude: "попадания из AWP (как у Leetify) — опциональный переключатель."
    scope: "Знаменатель — все попадания по противнику за период, а не все выстрелы. Попадание в голову — hitgroup head."
    example: "4 247 попаданий, 556 в голову → 13.1%."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-012"
    name: "Распределение попаданий по зонам"
    domain: "Точность"
    unit: "%"
    direction: "neutral"
    minSample: 30
    formula: "`hits_zone / hits × 100` для `head|chest|stomach|arms|legs`"
    tooltip: "Куда именно вы попадаете. Помогает увидеть стрельбу в корпус и ноги вместо головы и груди."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-013"
    name: "Урон за попадание"
    domain: "Точность"
    unit: "HP/попадание"
    direction: "up"
    minSample: 50
    formula: "`ΣDMG / Σhits`"
    tooltip: "Средний урон одного попадания. Зависит от зоны, оружия и дистанции; смотрится по оружию."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-014"
    name: "Попаданий на убийство"
    domain: "Точность"
    unit: "попаданий/убийство"
    direction: "down"
    minSample: 30
    formula: "`Σhits / Σkills`"
    tooltip: "Сколько попаданий нужно на одно убийство. Низкое значение — эффективное оружие и хорошие зоны."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-015"
    name: "Выстрелов на убийство"
    domain: "Точность"
    unit: "выстрелов/убийство"
    direction: "down"
    minSample: 30
    formula: "`Σshots / Σkills`"
    tooltip: "Сколько выстрелов тратится на убийство. Смешивает точность, контроль и выбор оружия."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-016"
    name: "Выстрелов на энгейджмент"
    domain: "Точность"
    unit: "выстрелов/энгейджмент"
    direction: "down"
    minSample: 30
    formula: "`Σshots / N(engagements)`"
    tooltip: "Сколько пуль уходит на одного противника. Прямой ответ на вопрос «сколько я жму"
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-017"
    name: "Пули до первого попадания"
    domain: "Точность"
    unit: "шт."
    direction: "down"
    minSample: 30
    formula: "`median(shots_before_first_hit)`"
    tooltip: "Сколько выстрелов проходит до первого попадания. 1 — попал сразу, 3+ — промахи по цели."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-018"
    name: "Точность по дистанции"
    domain: "Точность"
    unit: "%"
    direction: "up"
    minSample: 20
    formula: "`hits_band / shots_band × 100`"
    tooltip: "Точность на разных дистанциях. Провал на 1000+ — проблема с дальней стрельбой или выбором дистанции."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-019"
    name: "Доля промахов"
    domain: "Точность"
    unit: "%"
    direction: "down"
    minSample: 100
    formula: "`(shots − hits) / shots × 100`"
    tooltip: "Дополнение к точности. Удобно для сортировки «худшие сначала"
    derived: "`100 − ACC-003`"
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "ACC-020"
    name: "Попадания в своего"
    domain: "Точность"
    unit: "шт. и %"
    direction: "down"
    minSample: 50
    formula: "`Σ friendly_hits`, `% от всех попаданий`"
    tooltip: "Сколько вы стреляете по союзникам. Отдельно от тимкиллов: попадание не всегда убивает."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-001"
    name: "Preaim: средний угол между прицелом и ближайшим врагом"
    domain: "Механика прицеливания"
    unit: "градусы"
    direction: "down"
    minSample: 40
    formula: "`PRE = median(angle(view_at_first_visible, vector_to_enemy_head))`"
    tooltip: "Насколько твой прицел заранее смотрит туда, откуда появляется враг."
    include: "только первый тик видимости."
    exclude: "выбросы > 90° и энгейджменты без выстрела."
    scope: "На каждом сэмпле (1 Гц), когда враг ближе 1500 юнитов, считается угол между направлением взгляда и направлением на него. Берётся медиана."
    example: "Медиана 44° — прицел часто не там, где враг."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-002"
    name: "Crosshair placement (коррекция)"
    domain: "Механика прицеливания"
    unit: "градусы"
    direction: "down"
    minSample: 40
    formula: "`CHP = median(angle(view_at_first_visible, view_at_first_hit))`"
    tooltip: "Сколько градусов прицел прошёл от появления врага до первого попадания. Оценивает и стартовое положение, и моторику."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-003"
    name: "Crosshair idle offset"
    domain: "Механика прицеливания"
    unit: "градусы"
    direction: "down"
    minSample: 200
    formula: "`median(angle(view, vector_to_head_height_line))` по тикам без видимого врага"
    tooltip: "Держите ли вы прицел на линии головы вне боя. Считается по тикам без контакта, только на «горячих"
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-004"
    name: "Время до выстрела (TTS)"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 30
    formula: "`TTS = median(t_first_shot − t_first_visible)`"
    tooltip: "Сколько времени от появления врага до первого выстрела. Включает реакцию и решение, но не точность."
    exclude: "TTS > 1000 мс (дисциплина/ожидание)."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-005"
    name: "Время до первого урона (TTD)"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 30
    formula: "`TTD = median(t_first_damage − t_first_visible)`"
    tooltip: "Время от появления врага до первого урона. Не равно реакции: включает прицеливание, отдачу и темп оружия."
    exclude: "TTD > 1000 мс."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-006"
    name: "Время до убийства (TTK)"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 30
    formula: "`TTK = median(t_kill − t_first_visible)`"
    tooltip: "Время от появления цели до её смерти. Зависит от оружия и дистанции; смотрится по оружию."
    exclude: "убийства после > 2 с видимости, если цель менялась."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-007"
    name: "Время до наведения (TTA)"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 30
    formula: "`TTA = median(t_angle_within_1deg − t_first_visible)`"
    tooltip: "Сколько времени нужно, чтобы прицел оказался в пределах 1° от головы. Отделяет наведение от выстрела."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-008"
    name: "Реакция"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 30
    formula: "`median(t_first_view_change − t_first_visible)`, где изменение угла ≥ 0.5°"
    tooltip: "Время до первого заметного движения прицела после появления врага. Ближе всего к чистой реакции, но включает префайр."
    exclude: "энгейджменты, где игрок уже стрелял."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-009"
    name: "Доля выстрелов с включённым зумом (AUG/SG/AWP)"
    domain: "Механика прицеливания"
    unit: "°/с"
    direction: "up"
    minSample: 30
    formula: "`median(Δangle / Δt)` на интервале до первого попадания"
    tooltip: "Как часто ты стреляешь в зуме из оружия, у которого он есть."
    scope: "Только выстрелы из оружия с зумом: AWP, SSG 08, SCAR-20, G3SG1, AUG, SG 553."
    example: "1 000 выстрелов с зумом, 491 в зуме → 49.1%."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-010"
    name: "Дальность флика"
    domain: "Механика прицеливания"
    unit: "градусы"
    direction: "neutral"
    minSample: 30
    formula: "`median(max_angle_delta)`"
    tooltip: "Насколько большой угол пришлось доводить. Характеризует стиль: предаим versus реактивные флики."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-011"
    name: "Время до остановки"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 30
    formula: "`median(t_speed_below_34% − t_stop_start)`"
    tooltip: "Сколько времени занимает погасить скорость перед выстрелом. Прямая мера контр-стрейфинга в моменте."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-012"
    name: "Доля выстрелов на почти полной остановке (контр-стрейфинг)"
    domain: "Механика прицеливания"
    unit: "%"
    direction: "up"
    minSample: 60
    formula: "`good_shots / rifle_shots × 100`, good = скорость < 34% максимальной"
    tooltip: "Как часто ты стреляешь, остановившись, а не на бегу."
    exclude: "выстрелы в приседе, пистолеты, дробовики."
    scope: "Выстрел считается «на остановке», если горизонтальная скорость в момент выстрела ниже 34% от максимума (85 юнитов/с)."
    example: "21 234 выстрела, 19 980 на остановке → 94.1%."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-013"
    name: "Средняя скорость в момент выстрела (% от максимума)"
    domain: "Механика прицеливания"
    unit: "% от max"
    direction: "down"
    minSample: 60
    formula: "`median(speed_at_shot / max_speed × 100)`"
    tooltip: "Насколько быстро ты двигаешься в момент выстрела."
    scope: "Горизонтальная скорость в момент каждого выстрела делится на 250 юнитов/с и усредняется."
    example: "Средняя скорость 28 юнитов/с → 11.2%."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-014"
    name: "Доля выстрелов в приседе"
    domain: "Механика прицеливания"
    unit: "%"
    direction: "neutral"
    minSample: 60
    formula: "`shots_crouched / shots × 100`"
    tooltip: "Как часто вы стреляете из приседа. Меняет профиль точности и уязвимости."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-015"
    name: "Доля выстрелов в воздухе"
    domain: "Механика прицеливания"
    unit: "%"
    direction: "down"
    minSample: 60
    formula: "`shots_airborne / shots × 100`"
    tooltip: "Выстрелы в прыжке/падении. Обычно менее точны, кроме специальных приёмов."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-016"
    name: "Максимальная длина серии выстрелов"
    domain: "Механика прицеливания"
    unit: "выстрелов"
    direction: "neutral"
    minSample: 30
    formula: "`median(consecutive_shots)`, распределение 1–2 / 3–5 / 6–10 / 11+"
    tooltip: "Самая длинная очередь, которую ты выдал."
    scope: "Максимальный номер выстрела в серии без паузы длиннее 8 тиков."
    example: "Самая длинная серия за период — 30 выстрелов."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-017"
    name: "Средний интервал между выстрелами в серии"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "neutral"
    minSample: 100
    formula: "`median(t_shot_next − t_shot)`"
    tooltip: "Как быстро ты стреляешь внутри очереди."
    scope: "Медиана пауз между соседними выстрелами внутри серии, в миллисекундах."
    example: "78 мс — примерно 13 выстрелов в секунду."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-018"
    name: "Время восстановления отдачи"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 20
    formula: "`median(t_accuracy_reset − t_last_shot)`"
    tooltip: "Сколько времени до возврата точности после серии. Показывает, умеете ли вы отпускать гашетку."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-019"
    name: "Время перезарядки"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 20
    formula: "`median(t_reload_end − t_reload_start)`"
    tooltip: "Длительность перезарядки. Включает только полные циклы, прерванные не считаются."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-020"
    name: "Смерти во время перезарядки"
    domain: "Механика прицеливания"
    unit: "шт. и %"
    direction: "down"
    minSample: 10
    formula: "`N(deaths при is_reloading)`, `% от смертей`"
    tooltip: "Смерти с пустым магазином. Частая причина — перезарядка в открытую."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-021"
    name: "Смерти с гранатой в руке"
    domain: "Механика прицеливания"
    unit: "шт. и %"
    direction: "down"
    minSample: 10
    formula: "`N(deaths, active_weapon ∈ grenades)`, `%`"
    tooltip: "Смерти, когда в руках была граната. Показывает тайминг ютилити."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-022"
    name: "Время до первого выстрела после выхода из-за угла"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 30
    formula: "`median(t_first_shot − t_exit_cover)`"
    tooltip: "Насколько быстро вы стреляете после выхода из укрытия. Штрафуется, если вы выходите и не стреляете."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-023"
    name: "Процент «сухих» выходов"
    domain: "Механика прицеливания"
    unit: "%"
    direction: "down"
    minSample: 30
    formula: "`N(выход из укрытия без выстрела за 500 мс) / N(выходов) × 100`"
    tooltip: "Выходы без выстрела. Часто означают плохой предаим или лишний пик."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-024"
    name: "Время до убийства по оружию"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 20
    formula: "`TTK_w`"
    tooltip: "TTK конкретного оружия. Позволяет увидеть, что AWP вы используете быстро, а AK — медленно."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-025"
    name: "TTD по оружию"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 20
    formula: "`TTD_w`"
    tooltip: "TTD конкретного оружия. Нужен для сравнения пистолетов и винтовок без смешивания."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-026"
    name: "TTS по оружию"
    domain: "Механика прицеливания"
    unit: "мс"
    direction: "down"
    minSample: 20
    formula: "`TTS_w`"
    tooltip: "TTS конкретного оружия. Показывает, насколько быстро вы начинаете бой с ним."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-027"
    name: "Пули на противника по оружию"
    domain: "Механика прицеливания"
    unit: "выстрелов/энгейджмент"
    direction: "down"
    minSample: 20
    formula: "`shots_weapon / engagements_weapon`"
    tooltip: "Сколько пуль уходит на противника конкретным оружием. Ключевая метрика расточительности."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-028"
    name: "Точность после первого промаха"
    domain: "Механика прицеливания"
    unit: "%"
    direction: "up"
    minSample: 40
    formula: "`hits_after_miss / shots_after_miss × 100`"
    tooltip: "Насколько точны выстрелы после того, как первый ушёл в молоко."
    scope: "Знаменатель — выстрелы серии со второго и дальше. Показывает, исправляешься ли ты после промаха."
    example: "8 000 выстрелов, 1 216 попали → 15.2%."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-029"
    name: "Паттерн отдачи (отклонение от идеала)"
    domain: "Механика прицеливания"
    unit: "градусы"
    direction: "down"
    minSample: 30
    formula: "`median(angle(shot_dir, ideal_recoil_pattern_dir))`"
    tooltip: "Насколько ваш реальный спрей отклоняется от идеального паттерна оружия. Требует эталонных паттернов."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "AIM-030"
    name: "Вертикальный контроль отдачи"
    domain: "Механика прицеливания"
    unit: "%"
    direction: "up"
    minSample: 30
    formula: "`1 − median(|Δpitch_real − Δpitch_ideal|) / Δpitch_ideal`"
    tooltip: "Насколько точно вы компенсируете подъём ствола. Отдельно от горизонтального контроля."
    sources: ["Leetify", "CSStats", "Refrag", "CSRep", "Scope"]
    version: 1
  - id: "WPN-001"
    name: "Использование оружия"
    domain: "Оружие"
    unit: "% выстрелов"
    direction: "neutral"
    minSample: 100
    formula: "`shots_w / Σshots × 100`"
    tooltip: "Доля выстрелов каждым оружием. Показывает реальный пул, а не купленное."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-002"
    name: "Раунды с оружием"
    domain: "Оружие"
    unit: "шт."
    direction: "neutral"
    minSample: 10
    formula: "`N(rounds, где был хотя бы один выстрел из w)`"
    tooltip: "В скольких раундах вы реально стреляли этим оружием."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-003"
    name: "K/D оружием"
    domain: "Оружие"
    unit: "коэффициент"
    direction: "up"
    minSample: 20
    formula: "`K_w / max(D_w, 1)`"
    tooltip: "Убийства к смертям, когда в руках было это оружие. Смерти с другим оружием не входят."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-004"
    name: "KPR оружием"
    domain: "Оружие"
    unit: "шт./раунд"
    direction: "up"
    minSample: 20
    formula: "`K_w / rounds_w`"
    tooltip: "Убийства за раунд с оружием. Нормирует на количество раундов."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-005"
    name: "Урон на доллар"
    domain: "Оружие"
    unit: "HP/$"
    direction: "up"
    minSample: 1000
    formula: "`ΣDMG_w / Σcost_w` (cost — цена оружия + патроны)"
    tooltip: "Сколько урона приносит доллар, вложенный в оружие. Позволяет сравнивать экономическую эффективность."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-006"
    name: "Убийства на доллар"
    domain: "Оружие"
    unit: "убийств/$1000"
    direction: "up"
    minSample: 20
    formula: "`K_w / (Σcost_w / 1000)`"
    tooltip: "Сколько убийств на каждую $1000, потраченную на оружие."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-007"
    name: "Эффективная дистанция"
    domain: "Оружие"
    unit: "юниты"
    direction: "neutral"
    minSample: 30
    formula: "`median(distance_at_hit)`"
    tooltip: "Типичная дистанция попаданий оружием. Сравнивается с паспортной эффективной дистанцией."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-008"
    name: "Промахи на дистанции (falloff)"
    domain: "Оружие"
    unit: "%"
    direction: "down"
    minSample: 20
    formula: "`miss_rate(distance_band)` для оружия"
    tooltip: "Деградация точности с дистанцией. Помогает понять, где оружие перестаёт работать."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-009"
    name: "Использование прицела / зума"
    domain: "Оружие"
    unit: "% выстрелов"
    direction: "neutral"
    minSample: 30
    formula: "`shots_scoped / shots_sniper × 100`"
    tooltip: "Доля выстрелов из снайперки в зуме. Низкое значение — много quickscope/noscope."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-010"
    name: "Перезарядки на убийство"
    domain: "Оружие"
    unit: "шт."
    direction: "down"
    minSample: 20
    formula: "`Σreloads / Σkills`"
    tooltip: "Сколько раз вы перезаряжаетесь на одно убийство. Высокое — расточительность или плохой контроль магазина."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-011"
    name: "Остаток патронов после убийства"
    domain: "Оружие"
    unit: "шт."
    direction: "up"
    minSample: 20
    formula: "`median(ammo_after_kill)`"
    tooltip: "Сколько патронов остаётся после убийства. Мало — риск быть без патронов в следующем контакте."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-012"
    name: "Wasted magazine ammo"
    domain: "Оружие"
    unit: "%"
    direction: "down"
    minSample: 20
    formula: "`wasted / magazine_size × 100`, wasted = патроны, выброшенные перезарядкой"
    tooltip: "Доля магазина, выброшенная при перезарядке. 0% — перезарядка в пустоту, 100% — полный магазин в мусор."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-013"
    name: "Лучшее оружие"
    domain: "Оружие"
    unit: "weapon_id"
    direction: "neutral"
    minSample: 20
    formula: "`argmax(impact_w)`; impact = z(K/D) + z(ADR_w) + z(HSK_w)"
    tooltip: "Оружие с лучшим сочетанием K/D, урона и хедшотов при достаточной выборке. Не обязательно самое используемое."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-014"
    name: "Худшее оружие"
    domain: "Оружие"
    unit: "weapon_id"
    direction: "neutral"
    minSample: 20
    formula: "`argmin(impact_w)`"
    tooltip: "Оружие с худшим impact при достаточной выборке. Кандидат на тренировку."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-015"
    name: "Стоимость скинов в матче"
    domain: "Оружие"
    unit: "$"
    direction: "neutral"
    minSample: 1
    formula: "`Σ price(skin) по использованному оружию`"
    tooltip: "Суммарная рыночная стоимость скинов, которые были в игре. Косметика, не влияние."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-016"
    name: "Убийства подобранным оружием"
    domain: "Оружие"
    unit: "шт."
    direction: "up"
    minSample: 10
    formula: "`N(kills, где weapon.original_owner ≠ player)`"
    tooltip: "Убийства оружием, подобранным с земли. Показывает экономию и умение играть чужими пушками."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-017"
    name: "Доля убийств из пистолетов"
    domain: "Оружие"
    unit: "%"
    direction: "neutral"
    minSample: 30
    formula: "`pistol_kills / kills × 100`"
    tooltip: "Какая часть убийств сделана пистолетами."
    scope: "Все твои убийства за период; пистолеты — glock, USP, P2000, P250, Desert Eagle, R8, Dual Berettas, Tec-9, Five-SeveN, CZ75."
    example: "121 убийство, 20 из пистолетов → 16.5%."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-018"
    name: "Доля убийств из снайперок"
    domain: "Оружие"
    unit: "%"
    direction: "neutral"
    minSample: 30
    formula: "`sniper_kills / kills × 100`"
    tooltip: "Доля снайперских убийств. Определяет, являетесь ли вы AWP-игроком."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-019"
    name: "Доля убийств из пистолетов-пулемётов (SMG)"
    domain: "Оружие"
    unit: "%"
    direction: "neutral"
    minSample: 30
    formula: "`smg_kills / kills × 100`"
    tooltip: "Какая часть убийств сделана SMG."
    scope: "Все убийства; SMG — MP9, MP7, MP5-SD, UMP-45, P90, PP-Bizon, MAC-10."
    example: "121 убийство, 20 из SMG → 16.5%."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-020"
    name: "Доля убийств из дробовиков"
    domain: "Оружие"
    unit: "%"
    direction: "neutral"
    minSample: 30
    formula: "`heavy_kills / kills × 100`"
    tooltip: "Доля убийств из тяжёлого оружия. Показывает пристрастие к ближнему бою."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-021"
    name: "Первый выстрел в голову по оружию"
    domain: "Оружие"
    unit: "%"
    direction: "up"
    minSample: 20
    formula: "`first_hits_head_w / first_hits_w × 100`"
    tooltip: "Как часто первый же выстрел оружием приходит в голову. Самая чистая связка предаима и оружия."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-022"
    name: "Убийств на 100 выстрелов"
    domain: "Оружие"
    unit: "убийств/100"
    direction: "up"
    minSample: 100
    formula: "`K_w / shots_w × 100`"
    tooltip: "Сколько убийств приносит каждая сотня выстрелов."
    scope: "Убийства делятся на выстрелы и умножаются на 100. Учитываются все выстрелы, включая промахи."
    example: "121 убийство / 21 234 выстрела × 100 → 0.57 на 100. При стрельбе в воздух падает."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-023"
    name: "Доля попаданий в голову среди попаданий (по урону)"
    domain: "Оружие"
    unit: "% попаданий"
    direction: "up"
    minSample: 30
    formula: "`head_hits_w / hits_w × 100`"
    tooltip: "Какая часть попаданий пришлась в голову."
    scope: "Попадания в голову делятся на все попадания по противнику за период."
    example: "4 247 попаданий, 497 в голову → 11.7%."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-024"
    name: "Серии из 3+ выстрелов (спреи)"
    domain: "Оружие"
    unit: "шт."
    direction: "neutral"
    minSample: 20
    formula: "`N(sprays_w)`"
    tooltip: "Сколько раундов ты стрелял очередями от трёх выстрелов."
    scope: "Считаются раунды, где у тебя была серия из трёх и более выстрелов подряд (пауза ≤ 8 тиков)."
    example: "160 раундов, 84 раунда со спреем."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "WPN-025"
    name: "Смерти с оружием"
    domain: "Оружие"
    unit: "шт."
    direction: "down"
    minSample: 20
    formula: "`D_w`"
    tooltip: "Смерти, когда оружие было в руках. Нужны для K/D по оружию и для понимания слабых пушек."
    sources: ["CSStats", "Scope"]
    version: 1
  - id: "UTL-001"
    name: "Брошено гранат"
    domain: "Ютилити"
    unit: "шт."
    direction: "neutral"
    minSample: 20
    formula: "`Σ grenades_thrown`"
    tooltip: "Все брошенные гранаты всех типов. База для нормировки остальных метрик."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-002"
    name: "Гранат за раунд"
    domain: "Ютилити"
    unit: "шт./раунд"
    direction: "up"
    minSample: 20
    formula: "`Σthrown / ΣR`"
    tooltip: "Сколько гранат вы используете за раунд. 3+ считается высоким util-объёмом."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-003"
    name: "Использовано из купленного"
    domain: "Ютилити"
    unit: "%"
    direction: "up"
    minSample: 20
    formula: "`used / bought × 100`"
    tooltip: "Доля купленных гранат, которые вы реально бросили. Низкое — деньги на ветер."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-004"
    name: "Флешки брошены"
    domain: "Ютилити"
    unit: "шт."
    direction: "neutral"
    minSample: 10
    formula: "`Σ flashes`"
    tooltip: "Количество брошенных флешек. Само по себе не говорит о качестве."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-005"
    name: "Врагов ослеплено"
    domain: "Ютилити"
    unit: "шт."
    direction: "up"
    minSample: 20
    formula: "`Σ enemies_flashed`"
    tooltip: "Сколько врагов получили полный блайнд (≥1.1 с). Частичные и «спиной"
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-006"
    name: "Врагов ослеплено за флешку"
    domain: "Ютилити"
    unit: "чел./флешка"
    direction: "up"
    minSample: 20
    formula: "`enemies_flashed / flashes`"
    tooltip: "Средняя эффективность флешки по врагам. Максимум 5; 0.5–1 — хороший уровень."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-007"
    name: "Врагов ослеплено полностью за флешку"
    domain: "Ютилити"
    unit: "чел./флешка"
    direction: "up"
    minSample: 20
    formula: "`enemies_fulled / flashes`"
    tooltip: "Сколько врагов получили полный блайнд от одной флешки. Строже, чем общий показатель."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-008"
    name: "Своих ослеплено за флешку"
    domain: "Ютилити"
    unit: "чел./флешка"
    direction: "down"
    minSample: 20
    formula: "`friends_flashed / flashes`"
    tooltip: "Сколько союзников (включая себя) вы слепите одной флешкой. Высокое — рискованная флешка."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-009"
    name: "Самоослепления"
    domain: "Ютилити"
    unit: "шт. и %"
    direction: "down"
    minSample: 20
    formula: "`N(self_flashed)`, `% от флешек`"
    tooltip: "Флешки, ослепившие вас самих. Часто результат броска в стену или позднего пика."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-010"
    name: "Полная слепота союзников"
    domain: "Ютилити"
    unit: "шт."
    direction: "down"
    minSample: 20
    formula: "`N(teammate_full_flash)`"
    tooltip: "Случаи, когда союзник получил полный блайнд от вашей флешки. Опаснее частичного."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-011"
    name: "Общее время слепоты врагов"
    domain: "Ютилити"
    unit: "сек"
    direction: "up"
    minSample: 20
    formula: "`Σ blind_duration_enemies`"
    tooltip: "Суммарная длительность ослепления врагов. Абсолютный объём, не нормированный."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-012"
    name: "Время слепоты на флешку"
    domain: "Ютилити"
    unit: "сек/флешка"
    direction: "up"
    minSample: 20
    formula: "`Σduration / flashes`"
    tooltip: "Сколько секунд слепоты приносит одна флешка. Сравнивается с бенчмарком ранга."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-013"
    name: "Флеш-ассисты"
    domain: "Ютилити"
    unit: "шт."
    direction: "up"
    minSample: 20
    formula: "`Σ flash_assists`"
    tooltip: "Ассисты по правилам демки. В отличие от игрового счётчика, включает и ваши добивания ослеплённого."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-014"
    name: "Полезные флеш-ассисты"
    domain: "Ютилити"
    unit: "шт."
    direction: "up"
    minSample: 20
    formula: "`Σ impactful_assists`, impactful = блайнд ≥ 1.1 с и килл в течение 3 с"
    tooltip: "Флеш-ассисты, которые реально привели к убийству в короткое окно."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-015"
    name: "Флешки, приведшие к убийству"
    domain: "Ютилити"
    unit: "%"
    direction: "up"
    minSample: 20
    formula: "`N(flashes → kill) / flashes × 100`"
    tooltip: "Доля флешек, после которых был убит ослеплённый враг. Не путать с ассистом."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-016"
    name: "Эффективные флешки"
    domain: "Ютилити"
    unit: "шт. и %"
    direction: "up"
    minSample: 20
    formula: "`N(blind ≥ 1.1 s)`, `%`"
    tooltip: "Флешки, давшие полный блайнд. Используется для классификации «эффективная/пустая"
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-017"
    name: "Пустые флешки"
    domain: "Ютилити"
    unit: "шт. и %"
    direction: "down"
    minSample: 20
    formula: "`flashes − effective`, `%`"
    tooltip: "Флешки без полного блайнда. Обычно брошены в стену, слишком рано или мимо."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-018"
    name: "Смоки брошены"
    domain: "Ютилити"
    unit: "шт."
    direction: "neutral"
    minSample: 10
    formula: "`Σ smokes`"
    tooltip: "Количество брошенных смоков."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-019"
    name: "Смоки за раунд"
    domain: "Ютилити"
    unit: "шт./раунд"
    direction: "up"
    minSample: 20
    formula: "`Σsmokes / ΣR`"
    tooltip: "Смоков за раунд. Высокий уровень в среднем 0.7–1.2 для CT."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-020"
    name: "Смоки, остановившие пуш"
    domain: "Ютилити"
    unit: "%"
    direction: "up"
    minSample: 15
    formula: "`good_smokes / smokes_CT × 100`, good = враг в радиусе 800 юнитов от центра смока в момент раскрытия"
    tooltip: "Доля CT-смоков, накрывших реальное давление. Смок в пустоту не считается."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-021"
    name: "Покрытие смока"
    domain: "Ютилити"
    unit: "юниты²"
    direction: "neutral"
    minSample: 10
    formula: "`median(area_covered)`"
    tooltip: "Площадь, реально перекрытая смоком с учётом геометрии. Показывает качество лайнапа."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-022"
    name: "Смоки, поставленные на выход"
    domain: "Ютилити"
    unit: "%"
    direction: "up"
    minSample: 15
    formula: "`smokes_on_exec / smokes_T × 100`"
    tooltip: "Доля T-смоков, поставленных в первые 10 с раунда на точку. Характеризует структурность."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-023"
    name: "HE брошены"
    domain: "Ютилити"
    unit: "шт."
    direction: "neutral"
    minSample: 10
    formula: "`Σ HE`"
    tooltip: "Количество HE-гранат."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-024"
    name: "Урон врагам за HE"
    domain: "Ютилити"
    unit: "HP/HE"
    direction: "up"
    minSample: 15
    formula: "`Σdmg_foe_HE / ΣHE`"
    tooltip: "Средний урон врагам одной HE. Учитывается только реальный урон, не оверкилл."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-025"
    name: "Урон союзникам за HE"
    domain: "Ютилити"
    unit: "HP/HE"
    direction: "down"
    minSample: 15
    formula: "`Σdmg_friend_HE / ΣHE`"
    tooltip: "Средний урон своим от HE. 0–1 — аккуратно, 3+ — опасно."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-026"
    name: "Убийства HE"
    domain: "Ютилити"
    unit: "шт."
    direction: "up"
    minSample: 10
    formula: "`ΣHE_kills`"
    tooltip: "Добивания гранатой. Часто результат подготовки урона."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-027"
    name: "Молотовы брошены"
    domain: "Ютилити"
    unit: "шт."
    direction: "neutral"
    minSample: 10
    formula: "`Σ molotovs`"
    tooltip: "Количество зажигательных гранат."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-028"
    name: "Урон огнём"
    domain: "Ютилити"
    unit: "HP"
    direction: "up"
    minSample: 15
    formula: "`Σ fire_damage`"
    tooltip: "Урон врагам от огня. Включает и урон после вашей смерти, если граната ваша."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-029"
    name: "Урон огнём за молотов"
    domain: "Ютилити"
    unit: "HP/молотов"
    direction: "up"
    minSample: 15
    formula: "`fire_damage / molotovs`"
    tooltip: "Средний урон одним молотовым. Показывает качество зон контроля."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-030"
    name: "Огонь по своим"
    domain: "Ютилити"
    unit: "HP и HP/молотов"
    direction: "down"
    minSample: 15
    formula: "`friendly_fire_damage`, `/ molotovs`"
    tooltip: "Урон союзникам огнём. Особенно больно в узких проходах."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-031"
    name: "Площадь молотова"
    domain: "Ютилити"
    unit: "юниты²"
    direction: "neutral"
    minSample: 10
    formula: "`median(area_covered)`"
    tooltip: "Площадь огня. Крупная площадь не всегда полезна: важнее перекрыть нужный проход."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-032"
    name: "Декой брошены"
    domain: "Ютилити"
    unit: "шт."
    direction: "neutral"
    minSample: 5
    formula: "`Σ decoys`"
    tooltip: "Количество деков. В CS2 декой почти не используется, поэтому показывается отдельно."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-033"
    name: "Неиспользованная граната на смерть"
    domain: "Ютилити"
    unit: "$"
    direction: "down"
    minSample: 20
    formula: "`Σ value(utility_on_death) / deaths`"
    tooltip: "Средняя стоимость гранат в момент смерти. Показывает, доносите ли вы ютилити до боя."
    derived: "`UTL-034 / deaths`"
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-034"
    name: "Стоимость неиспользованного ютилити"
    domain: "Ютилити"
    unit: "$"
    direction: "down"
    minSample: 20
    formula: "`Σ (smoke×300 + HE×300 + flash×200 + molotov×400 + decoy×50) на смерть`"
    tooltip: "Деньги, потерянные с непушенными гранатами. Суммируется по всем смертям."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-035"
    name: "Доля раундов с гранатой в руке на смерть"
    domain: "Ютилити"
    unit: "%"
    direction: "down"
    minSample: 20
    formula: "`N(deaths с гранатой в руке) / deaths × 100`"
    tooltip: "Как часто вы умираете с гранатой. Связано с таймингом ютилити и пиками."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-036"
    name: "Качество ютилити"
    domain: "Ютилити"
    unit: "рейтинг 0–100"
    direction: "up"
    minSample: 100
    formula: "`z-среднее` от эффективности флешек, урона HE/молотова, покрытия смоков и штрафа за своих"
    tooltip: "Композит качества: насколько полезна каждая граната. Не зависит от количества."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-037"
    name: "Количество ютилити"
    domain: "Ютилити"
    unit: "рейтинг 0–100"
    direction: "up"
    minSample: 20
    formula: "`clamp(grenades_per_round / 3 × 100, 0, 100)`"
    tooltip: "Оценка объёма: 3+ гранаты за раунд дают 100. Качество считается отдельно."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-038"
    name: "Общий utility rating"
    domain: "Ютилити"
    unit: "рейтинг 0–100"
    direction: "up"
    minSample: 100
    formula: "`sqrt(quality × quantity)`"
    tooltip: "Геометрическое среднее качества и количества. Провал в одном компоненте тянет вниз весь рейтинг."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-039"
    name: "Гранат на доллар"
    domain: "Ютилити"
    unit: "шт./$1000"
    direction: "up"
    minSample: 20
    formula: "`grenades / (utility_cost / 1000)`"
    tooltip: "Сколько гранат на каждую $1000. Показывает, покупаете ли вы ютилити вообще."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "UTL-040"
    name: "Урон ютилити за раунд"
    domain: "Ютилити"
    unit: "HP/раунд"
    direction: "up"
    minSample: 20
    formula: "`ΣHE+fire_damage / ΣR`"
    tooltip: "Гранатный урон за раунд. Часть ADR, но отдельно показывает вклад гранат."
    sources: ["Leetify", "Scope", "CSStats", "Refrag"]
    version: 1
  - id: "ECO-001"
    name: "Стоимость экипировки на старте раунда (медиана)"
    domain: "Экономика"
    unit: "$"
    direction: "neutral"
    minSample: 10
    formula: "`median(equip_value_start)`; командный — `Σ` пяти игроков"
    tooltip: "Сколько в среднем стоит твой закуп на старте раунда."
    scope: "Стоимость снаряжения (оружие, броня, гранаты) в первом сэмпле раунда. Медиана по всем раундам периода."
    example: "Медиана $3 563 — типичный закуп между форсом и фуллом."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-002"
    name: "Кэш на старте раунда"
    domain: "Экономика"
    unit: "$"
    direction: "neutral"
    minSample: 10
    formula: "`median(cash_start)`"
    tooltip: "Свободные деньги на старте. Сопоставляется с ценой закупа."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-003"
    name: "Потрачено за раунд"
    domain: "Экономика"
    unit: "$/раунд"
    direction: "neutral"
    minSample: 10
    formula: "`Σcash_spent / ΣR`"
    tooltip: "Средние траты за раунд. Показывает экономическую агрессию."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-004"
    name: "Тип закупа"
    domain: "Экономика"
    unit: "категория"
    direction: "neutral"
    minSample: 10
    formula: "класс из §4.8; распределение `% раундов`"
    tooltip: "Распределение раундов по типу закупа: пистолет, эко, полу-эко, форс, фулл-бай. Сумма 100%."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-005"
    name: "Доля раундов с фулл-баем"
    domain: "Экономика"
    unit: "%"
    direction: "up"
    minSample: 10
    formula: "`full_buy_rounds / rounds × 100`"
    tooltip: "Как часто ты закупаешься полностью."
    scope: "Раунд считается фулл-баем, если экипировка на старте ≥ $3 800. Пистолетные раунды не входят."
    example: "160 раундов, 58 фулл-баев → 36.3%."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-006"
    name: "Доля эко"
    domain: "Экономика"
    unit: "%"
    direction: "neutral"
    minSample: 10
    formula: "`eco_rounds / rounds × 100`"
    tooltip: "Доля эко-раундов. Сама по себе не плоха: эко после проигранного пистолета — норма."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-007"
    name: "Win rate пистолетных раундов"
    domain: "Экономика"
    unit: "%"
    direction: "up"
    minSample: 10
    formula: "`pistol_wins / pistol_rounds × 100`"
    tooltip: "Как часто твоя команда берёт пистолетный раунд."
    scope: "Только раунды 1 и 13 (первые раунды половин). Победы делятся на число таких раундов."
    example: "16 пистолетных раундов, 10 побед → 62.5%."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-008"
    name: "Win rate анти-эко"
    domain: "Экономика"
    unit: "%"
    direction: "up"
    minSample: 10
    formula: "`anti_eco_wins / anti_eco_rounds × 100`"
    tooltip: "Победы в раундах, где у вас фулл, а у врага эко. Провалы здесь — самый дорогой тип ошибок."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-009"
    name: "Win rate форс-баев"
    domain: "Экономика"
    unit: "%"
    direction: "up"
    minSample: 10
    formula: "`force_wins / force_rounds × 100`"
    tooltip: "Победы в форс-раундах. Показывает качество игры без полного снаряжения."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-010"
    name: "Win rate раундов с фулл-баем"
    domain: "Экономика"
    unit: "%"
    direction: "up"
    minSample: 20
    formula: "`full_wins / full_rounds × 100`"
    tooltip: "Как часто ты выигрываешь, когда закупился полностью."
    scope: "Победы в раундах с экипировкой ≥ $3 800 делятся на число таких раундов."
    example: "58 фулл-баев, 32 победы → 55.2%."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-011"
    name: "Деньги на смерть"
    domain: "Экономика"
    unit: "$"
    direction: "down"
    minSample: 20
    formula: "`median(cash_at_death)`"
    tooltip: "Сколько денег остаётся при смерти. Большие суммы — неиспользованный потенциал."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-012"
    name: "Стоимость потерянной экипировки"
    domain: "Экономика"
    unit: "$"
    direction: "down"
    minSample: 20
    formula: "`Σ equip_value_at_death`"
    tooltip: "Стоимость снаряжения, потерянного при смертях. Считается по фактической экипировке."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-013"
    name: "Эффективность экипировки"
    domain: "Экономика"
    unit: "HP/$1000"
    direction: "up"
    minSample: 10
    formula: "`ΣAD` (урон) `/ (Σequip_value / 1000)`"
    tooltip: "Сколько урона приносит каждая $1000 экипировки. Показывает отдачу от закупа."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-014"
    name: "Сейв-рейт"
    domain: "Экономика"
    unit: "%"
    direction: "up"
    minSample: 10
    formula: "`survived_lost_rounds / lost_rounds × 100`"
    tooltip: "Как часто вы сохраняетесь в проигранных раундах. Высокое — дисциплина, но может быть пассивность."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-015"
    name: "Стоимость сохранённого"
    domain: "Экономика"
    unit: "$/сейв"
    direction: "up"
    minSample: 10
    formula: "`Σ saved_value / saves`"
    tooltip: "Сколько денег вы сохраняете за один сейв. AWP весит больше AK."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-016"
    name: "Деньги заработано"
    domain: "Экономика"
    unit: "$/раунд"
    direction: "up"
    minSample: 20
    formula: "`Σcash_earned / ΣR`"
    tooltip: "Средний доход за раунд: убийства, цели, лосс-бонус. Показывает экономический темп."
    sources: ["Scope", "CSStats"]
    version: 1
  - id: "ECO-017"
    name: "Деньги за убийство"
    domain: "Экономика"
    unit: "$/убийство"
    direction: "up"
    minSample: 30
    formula: "`Σkill_reward / ΣK`"
